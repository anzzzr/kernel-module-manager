name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  go-test:
    name: Go Test & Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Go Vet
        run: go vet ./...

      - name: Run Go Unit & Security Policy Tests
        run: go test ./... -v

  python-test:
    name: Python Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'ai_service/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_service/requirements.txt
          pip install ruff respx

      - name: Run Ruff Linter
        run: ruff check --config ai_service/pyproject.toml ai_service/ eval/

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: pytest eval/test_metrics.py eval/test_injection.py ai_service/tests/ -v

  eval-smoke-test:
    name: RAG Evaluation Benchmark Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'ai_service/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_service/requirements.txt

      - name: Run RAG Benchmark Harness (Mocked LLM, Zero Secrets)
        env:
          PYTHONPATH: .
        run: python3 eval/run_eval.py --mode hybrid_rag --mock-llm
